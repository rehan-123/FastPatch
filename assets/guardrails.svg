<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" role="img" aria-label="Six things FastPatch will never do: Restart your machines (Your maintenance window does that, on your schedule); Change Windows Update settings (It works with whoever manages updates today); Delete Windows repair files (It repairs. It never wipes.); Touch antivirus or security tools (Your security stack stays exactly as it is); Loop without a limit (One search, one download, one install per run); Say “success” without proof (Done means installed after the restart)"><title>Six things FastPatch will never do: Restart your machines (Your maintenance window does that, on your schedule); Change Windows Update settings (It works with whoever manages updates today); Delete Windows repair files (It repairs. It never wipes.); Touch antivirus or security tools (Your security stack stays exactly as it is); Loop without a limit (One search, one download, one install per run); Say “success” without proof (Done means installed after the restart)</title><style>@font-face{font-family:'CascadiaSub';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PlexSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PlexSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PlexSub';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}.P{font-family:'PlexSub','IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif}.M{font-family:'CascadiaSub','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;white-space:pre}@keyframes gstrike{0%,12%{stroke-dashoffset:var(--l)}30%,100%{stroke-dashoffset:0}}@media (prefers-reduced-motion:no-preference){.gs0{animation:gstrike 7s ease-out 0.00s infinite}.gs1{animation:gstrike 7s ease-out 0.35s infinite}.gs2{animation:gstrike 7s ease-out 0.70s infinite}.gs3{animation:gstrike 7s ease-out 1.05s infinite}.gs4{anim